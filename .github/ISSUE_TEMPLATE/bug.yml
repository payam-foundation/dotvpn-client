name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security issues: do not open a public issue, follow SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version (release tag or commit)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (redact hostnames, IPs and tokens)
      render: text
