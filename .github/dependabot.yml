version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly}
    commit-message: {prefix: build, include: scope}
    groups:
      all: {patterns: ["*"], update-types: [minor, patch]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    commit-message: {prefix: ci, include: scope}
    groups:
      all: {patterns: ["*"], update-types: [minor, patch]}
